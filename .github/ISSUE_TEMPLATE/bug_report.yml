name: Bug report
description: Report a reproducible problem with the assessment or repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DMSI. Search existing issues first and do not include private assessment answers. Report security vulnerabilities through the private link below.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assessment flow
        - Scoring or results
        - Export, copy, or print
        - Theme or visual design
        - Accessibility
        - Documentation or metadata
        - Build or deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 142 on macOS 15
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots or console output if useful. Remove personal or student data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or private assessment data.
          required: true

